<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <div class="container">
      <div class="status-badge">Create Account</div>
      <img src="https://img.icons8.com/fluency/96/lock.png" alt="Logo" class="logo" />
      <h2>Create Account</h2>
      <p class="subtitle">Register securely with OTP verification</p>

      <div id="register-section">
        <input type="text" id="register-name" placeholder="Full Name" required />
        <input type="email" id="register-email" placeholder="Email Address" required />

        <div class="password-wrapper">
          <input type="password" id="register-password" placeholder="Create Password" required />
          <button type="button" id="toggleRegisterPassword" class="toggle-password" title="Show Password" tabindex="-1">Show</button>
        </div>

        <div class="password-wrapper">
          <input type="password" id="register-confirm-password" placeholder="Confirm Password" required />
          <button type="button" id="toggleRegisterConfirmPassword" class="toggle-password" title="Show Password" tabindex="-1">Show</button>
        </div>

        <div id="register-password-strength" class="message"></div>
        <button class="glow-btn" onclick="registerUser()">Register</button>
        <div id="register-message" class="message"></div>
        <p class="auth-link">Already have an account? <a href="index.html">Login</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
